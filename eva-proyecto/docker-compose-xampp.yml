version: '3.8'

services:
  # Backend PHP/Laravel (conectándose a XAMPP MySQL)
  backend:
    build:
      context: ./eva-backend
      dockerfile: Dockerfile
    container_name: eva_backend_xampp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=host.docker.internal  # Conecta al MySQL del host (XAMPP)
      - DB_PORT=3307                  # Puerto de XAMPP MySQL
      - DB_DATABASE=gestionthuv
      - DB_USERNAME=root              # Usuario de XAMPP
      - DB_PASSWORD=                  # Contraseña vacía de XAMPP (si es necesario cámbiala)
    volumes:
      - ./eva-backend:/var/www/html
      - ./eva-backend/storage:/var/www/html/storage
      - ./eva-backend/bootstrap/cache:/var/www/html/bootstrap/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Permite acceso al host
    networks:
      - eva_network

  # Frontend React/Vite
  frontend:
    build:
      context: ./eva-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://HOST_IP:8001/api
        - VITE_APP_NAME=EVA - Sistema de Gestión
    container_name: eva_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://HOST_IP:8001/api
      - VITE_API_BASE_URL=http://HOST_IP:8001
      - VITE_APP_NAME=EVA - Sistema de Gestión
    volumes:
      - ./eva-frontend/src:/app/src
      - ./eva-frontend/public:/app/public
      - ./eva-frontend/package.json:/app/package.json:ro
      - ./eva-frontend/vite.config.js:/app/vite.config.js:ro
    depends_on:
      - backend
    networks:
      - eva_network

networks:
  eva_network:
    driver: bridge
