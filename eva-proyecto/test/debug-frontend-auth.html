<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Frontend Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Debug Frontend Authentication</h1>
    
    <div class="section">
        <h2>📋 Estado del LocalStorage</h2>
        <div id="localStorage-status"></div>
        <button onclick="checkLocalStorage()">🔄 Verificar LocalStorage</button>
        <button onclick="clearLocalStorage()">🗑️ Limpiar LocalStorage</button>
    </div>

    <div class="section">
        <h2>🔐 Test de Login</h2>
        <div>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="admin">
            <button onclick="testLogin()">🚀 Test Login</button>
        </div>
        <div id="login-result"></div>
    </div>

    <div class="section">
        <h2>🧪 Test de Autenticación</h2>
        <button onclick="testAuth()">🔍 Verificar Estado Auth</button>
        <div id="auth-result"></div>
    </div>

    <div class="section">
        <h2>📊 Logs de Consola</h2>
        <div id="console-logs"></div>
        <button onclick="clearLogs()">🗑️ Limpiar Logs</button>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8001/api/v1';
        let logs = [];

        // Interceptar console.log para mostrar en la página
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            logs.push(new Date().toLocaleTimeString() + ': ' + args.join(' '));
            updateConsoleLogs();
        };

        function updateConsoleLogs() {
            document.getElementById('console-logs').innerHTML = 
                '<pre>' + logs.slice(-10).join('\n') + '</pre>';
        }

        function clearLogs() {
            logs = [];
            updateConsoleLogs();
        }

        function checkLocalStorage() {
            const token = localStorage.getItem('eva_auth_token');
            const user = localStorage.getItem('eva_user');
            const usuario = localStorage.getItem('usuario');
            
            let html = '<h3>🔍 Contenido del LocalStorage:</h3>';
            
            if (token) {
                html += `<div class="success">✅ eva_auth_token: ${token.substring(0, 50)}...</div>`;
            } else {
                html += `<div class="error">❌ eva_auth_token: No encontrado</div>`;
            }
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    html += `<div class="success">✅ eva_user: ${JSON.stringify(userData, null, 2)}</div>`;
                } catch (e) {
                    html += `<div class="error">❌ eva_user: Error parsing JSON</div>`;
                }
            } else {
                html += `<div class="error">❌ eva_user: No encontrado</div>`;
            }
            
            if (usuario) {
                try {
                    const usuarioData = JSON.parse(usuario);
                    html += `<div class="warning">⚠️ usuario (legacy): ${JSON.stringify(usuarioData, null, 2)}</div>`;
                } catch (e) {
                    html += `<div class="error">❌ usuario: Error parsing JSON</div>`;
                }
            } else {
                html += `<div class="warning">⚠️ usuario (legacy): No encontrado</div>`;
            }
            
            document.getElementById('localStorage-status').innerHTML = html;
        }

        function clearLocalStorage() {
            localStorage.removeItem('eva_auth_token');
            localStorage.removeItem('eva_user');
            localStorage.removeItem('usuario');
            console.log('🗑️ LocalStorage limpiado');
            checkLocalStorage();
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('🔐 Iniciando test de login...');
            
            try {
                const response = await fetch(`${API_BASE}/../auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                let html = '<h3>📋 Resultado del Login:</h3>';
                
                if (response.ok && data.success) {
                    html += `<div class="success">✅ Login exitoso</div>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    // Guardar en localStorage como lo haría la app
                    if (data.data && data.data.token) {
                        localStorage.setItem('eva_auth_token', data.data.token);
                        localStorage.setItem('eva_user', JSON.stringify(data.data.user));
                        console.log('💾 Datos guardados en localStorage');
                    }
                } else {
                    html += `<div class="error">❌ Login fallido</div>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                
                document.getElementById('login-result').innerHTML = html;
                checkLocalStorage();
                
            } catch (error) {
                console.error('Error en login:', error);
                document.getElementById('login-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testAuth() {
            const token = localStorage.getItem('eva_auth_token');
            
            if (!token) {
                document.getElementById('auth-result').innerHTML = 
                    '<div class="error">❌ No hay token para verificar</div>';
                return;
            }
            
            console.log('🔍 Verificando autenticación...');
            
            try {
                // Test con endpoint de usuarios (requiere auth)
                const response = await fetch(`${API_BASE}/usuarios-public?per_page=1`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                let html = '<h3>🔍 Resultado de Verificación:</h3>';
                
                if (response.ok && data.success) {
                    html += `<div class="success">✅ Token válido - Usuario autenticado</div>`;
                    html += `<div>Status: ${response.status}</div>`;
                    html += `<div>Usuarios encontrados: ${data.data?.data?.length || 0}</div>`;
                } else {
                    html += `<div class="error">❌ Token inválido o expirado</div>`;
                    html += `<div>Status: ${response.status}</div>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                
                document.getElementById('auth-result').innerHTML = html;
                
            } catch (error) {
                console.error('Error en verificación:', error);
                document.getElementById('auth-result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        // Inicializar al cargar la página
        window.onload = function() {
            checkLocalStorage();
            console.log('🚀 Debug Frontend Auth iniciado');
        };
    </script>
</body>
</html>
