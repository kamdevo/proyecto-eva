version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: eva_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: eva_root_password_2024
      MYSQL_DATABASE: gestionthuv
      MYSQL_USER: eva_user
      MYSQL_PASSWORD: eva_password_2024
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - eva_network
    command: --default-authentication-plugin=mysql_native_password

  # Backend PHP/Laravel
  backend:
    build:
      context: ./eva-backend
      dockerfile: Dockerfile
    container_name: eva_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gestionthuv
      - DB_USERNAME=eva_user
      - DB_PASSWORD=eva_password_2024
    volumes:
      - ./eva-backend:/var/www/html
      - ./eva-backend/storage:/var/www/html/storage
      - ./eva-backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - mysql
    networks:
      - eva_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React/Vite
  frontend:
    build:
      context: ./eva-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://HOST_IP:8001/api
        - VITE_APP_NAME=EVA - Sistema de Gestión
    container_name: eva_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    volumes:
      - ./eva-frontend/src:/app/src:ro
      - ./eva-frontend/public:/app/public:ro
    depends_on:
      - backend
    networks:
      - eva_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (Opcional - Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: eva_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - eva_network

  # Redis (Para cache y sesiones)
  redis:
    image: redis:7-alpine
    container_name: eva_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eva_network
    command: redis-server --appendonly yes --requirepass eva_redis_password_2024

networks:
  eva_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
