<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Sanctum CSRF Token</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>Test Sanctum CSRF Token</h1>
    <button onclick="testCsrfToken()">Test CSRF Token</button>
    <button onclick="testApiCall()">Test API Call</button>
    <div id="results"></div>

    <script>
      // Configurar axios
      axios.defaults.withCredentials = true;
      axios.defaults.baseURL = "http://127.0.0.1:8001";

      async function testCsrfToken() {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "<p>Probando CSRF Token...</p>";

        try {
          const response = await axios.get("/sanctum/csrf-cookie");
          resultsDiv.innerHTML +=
            '<p style="color: green;">✅ CSRF Token obtenido exitosamente!</p>';
          console.log("CSRF Response:", response);
        } catch (error) {
          resultsDiv.innerHTML +=
            '<p style="color: red;">❌ Error al obtener CSRF Token:</p>';
          resultsDiv.innerHTML +=
            "<pre>" +
            JSON.stringify(error.response?.data || error.message, null, 2) +
            "</pre>";
          console.error("CSRF Error:", error);
        }
      }

      async function testApiCall() {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML += "<p>Probando llamada a API...</p>";

        try {
          const response = await axios.get("/api/v1/correctivos-generales");
          resultsDiv.innerHTML +=
            '<p style="color: green;">✅ API llamada exitosa!</p>';
          resultsDiv.innerHTML +=
            "<pre>" + JSON.stringify(response.data, null, 2) + "</pre>";
          console.log("API Response:", response);
        } catch (error) {
          resultsDiv.innerHTML +=
            '<p style="color: red;">❌ Error en llamada a API:</p>';
          resultsDiv.innerHTML +=
            "<pre>" +
            JSON.stringify(error.response?.data || error.message, null, 2) +
            "</pre>";
          console.error("API Error:", error);
        }
      }

      // Test automático al cargar
      window.onload = function () {
        testCsrfToken();
      };
    </script>
  </body>
</html>
