<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Configuration Debug</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .config-item {
        margin: 10px 0;
        padding: 10px;
        background: #f5f5f5;
        border-radius: 5px;
      }
      .test-result {
        margin: 20px 0;
        padding: 15px;
        border-radius: 5px;
      }
      .success {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
      button {
        padding: 10px 20px;
        margin: 10px 5px;
        cursor: pointer;
      }
      pre {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>🔬 Frontend Configuration Debug</h1>

    <h2>📋 Configuration Values</h2>
    <div id="config-values"></div>

    <h2>🧪 Test Registration Endpoints</h2>
    <button onclick="testRegistration()">Test Registration</button>
    <button onclick="testMultipleEndpoints()">Test All Endpoints</button>

    <div id="test-results"></div>

    <script type="module">
      // Import the configuration
      import { API_CONFIG, AUTH_ENDPOINTS } from "/src/config/api.js";
      import httpService from "/src/services/httpService.js";
      import authService from "/src/services/authService.js";

      // Display configuration values
      const configDiv = document.getElementById("config-values");
      configDiv.innerHTML = `
            <div class="config-item"><strong>API_CONFIG.API_URL:</strong> ${
              API_CONFIG.API_URL
            }</div>
            <div class="config-item"><strong>AUTH_ENDPOINTS.REGISTER:</strong> ${
              AUTH_ENDPOINTS.REGISTER
            }</div>
            <div class="config-item"><strong>Expected Full URL:</strong> ${
              API_CONFIG.API_URL
            }${AUTH_ENDPOINTS.REGISTER}</div>
            <div class="config-item"><strong>VITE_API_URL:</strong> ${
              import.meta.env.VITE_API_URL
            }</div>
            <div class="config-item"><strong>VITE_AUTH_REGISTER_URL:</strong> ${
              import.meta.env.VITE_AUTH_REGISTER_URL
            }</div>
        `;

      // Test registration function
      window.testRegistration = async function () {
        const resultsDiv = document.getElementById("test-results");
        resultsDiv.innerHTML = "<p>🧪 Testing registration...</p>";

        const testData = {
          nombre: "Test Debug",
          apellido: "User",
          email: "testdebug@example.com",
          username: "testdebug123",
          password: "Test1234!",
          password_confirmation: "Test1234!",
        };

        try {
          console.log("🚀 Testing with authService...");
          console.log(
            "Expected URL:",
            `${API_CONFIG.API_URL}${AUTH_ENDPOINTS.REGISTER}`
          );

          // Intercept the axios request to see the exact URL being called
          let interceptedRequest = null;
          const requestInterceptor = httpService.interceptors.request.use(
            (config) => {
              if (config.url === AUTH_ENDPOINTS.REGISTER) {
                interceptedRequest = {
                  method: config.method,
                  url: config.url,
                  baseURL: config.baseURL,
                  fullURL: `${config.baseURL}${config.url}`,
                  headers: config.headers,
                };
                console.log("🔍 INTERCEPTED REQUEST:", interceptedRequest);
              }
              return config;
            }
          );

          const result = await authService.register(testData);

          // Remove the interceptor
          httpService.interceptors.request.eject(requestInterceptor);

          resultsDiv.innerHTML = `
                    <div class="test-result success">
                        <h3>✅ Registration Successful</h3>
                        <p><strong>Expected URL:</strong> ${
                          API_CONFIG.API_URL
                        }${AUTH_ENDPOINTS.REGISTER}</p>
                        <p><strong>Actual Request:</strong> ${
                          interceptedRequest
                            ? interceptedRequest.fullURL
                            : "Not captured"
                        }</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    </div>
                `;
        } catch (error) {
          console.error("❌ Registration failed:", error);
          resultsDiv.innerHTML = `
                    <div class="test-result error">
                        <h3>❌ Registration Failed</h3>
                        <p><strong>Expected URL:</strong> ${
                          API_CONFIG.API_URL
                        }${AUTH_ENDPOINTS.REGISTER}</p>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>Status:</strong> ${
                          error.response?.status
                        }</p>
                        <p><strong>URL:</strong> ${error.config?.url}</p>
                        <p><strong>Full URL:</strong> ${error.config?.baseURL}${
            error.config?.url
          }</p>
                        <pre>${JSON.stringify(
                          error.response?.data,
                          null,
                          2
                        )}</pre>
                    </div>
                `;
        }
      };

      // Test multiple endpoints function
      window.testMultipleEndpoints = async function () {
        const resultsDiv = document.getElementById("test-results");
        resultsDiv.innerHTML = "<p>🧪 Testing multiple endpoints...</p>";

        const endpoints = [
          { name: "AUTH_ENDPOINTS.REGISTER", url: AUTH_ENDPOINTS.REGISTER },
          { name: "Direct /v1/register-working", url: "/v1/register-working" },
          { name: "Direct /auth/register", url: "/auth/register" },
        ];

        let results = "";

        for (const endpoint of endpoints) {
          const testData = {
            nombre: "Test Multi",
            apellido: "Endpoint",
            email: `test-${endpoint.name.replace(/[^a-z]/gi, "")}@example.com`,
            username: `test${Date.now()}`,
            password: "Test1234!",
            password_confirmation: "Test1234!",
          };

          try {
            console.log(
              `🚀 Testing endpoint: ${endpoint.name} (${endpoint.url})`
            );
            const response = await httpService.post(endpoint.url, testData);

            results += `
                        <div class="test-result success">
                            <h4>✅ ${endpoint.name}</h4>
                            <p><strong>URL:</strong> ${endpoint.url}</p>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <pre>${JSON.stringify(response.data, null, 2)}</pre>
                        </div>
                    `;
          } catch (error) {
            console.error(`❌ ${endpoint.name} failed:`, error);
            results += `
                        <div class="test-result error">
                            <h4>❌ ${endpoint.name}</h4>
                            <p><strong>URL:</strong> ${endpoint.url}</p>
                            <p><strong>Error:</strong> ${error.message}</p>
                            <p><strong>Status:</strong> ${error.response?.status}</p>
                            <p><strong>Requested URL:</strong> ${error.config?.url}</p>
                            <p><strong>Full URL:</strong> ${error.config?.baseURL}${error.config?.url}</p>
                        </div>
                    `;
          }
        }

        resultsDiv.innerHTML = results;
      };

      // Auto-display config on load
      console.log("🔧 Configuration loaded:", {
        API_CONFIG,
        AUTH_ENDPOINTS,
        ENV: import.meta.env,
      });
    </script>
  </body>
</html>
